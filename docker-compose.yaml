services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env

  bot:
    build: .
    command: python manage.py run_bot
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - web